{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Connexion - PacMint{% endblock %}

{% block subtitle %}
    <h2 class="mb-4 lead" style="font-family:'Press Start 2P', cursive;">
        Connecte-toi à l'aventure !
    </h2>
{% endblock %}

{% block main %}
    <form action="{% url 'pacmint_app:login' %}" method="post" class="w-100">
        {% csrf_token %}
        {% crispy formulaire %}
        <div class="d-flex justify-content-between align-items-end mt-3">
            <a href="{% url 'pacmint_app:home' %}" class="btn btn-secondary">Retour</a>
            <button type="submit" class="btn btn-success">Se connecter</button>
        </div>
    </form>
{% endblock %}
