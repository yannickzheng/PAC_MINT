{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Pac‑Mint{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/new_logo.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'pacmint_app/home.css' %}">
</head>
<body class="bg-black text-white text-center">
<div class="container py-5">


   <!-- Logo uniquement, en plus grand -->
<img src="{% static 'images/new_logo.png' %}" alt="Logo Pac‑Mint"
     class="img-fluid mb-5 logo-animation" style="width:500px;">

    {# sous-titre #}
    {% block subtitle %}{% endblock subtitle %}



    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {# contenu principal #}
    {% block main %}{% endblock main %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
