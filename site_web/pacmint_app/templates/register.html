<!DOCTYPE html>
<html lang="fr">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Inscription - Pac-Mint</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/Logo.png' %}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font (style rétro) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'pacmint_app/home.css' %}">
</head>
<body class="bg-black text-white text-center">

    <div class="container py-5">
        <!-- Logo flottant -->
        <img src="{% static 'images/Logo.png' %}" alt="Logo Pac-Mint" class="img-fluid mb-4 logo-animation" style="width: 150px;">

        <!-- Titre -->
        <h1 class="display-4 fw-bold text-warning mb-5" style="font-family: 'Press Start 2P', cursive;">INSCRIPTION - PAC-MINT</h1>

        <!-- Message de bienvenue -->
        <p class="lead mb-5" style="font-family: 'Press Start 2P', cursive;">Inscris-toi et entre dans l'aventure !</p>

        <!-- Formulaire d'inscription -->
        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="mb-3">
                <label for="password_confirm" class="form-label">Confirmer le mot de passe</label>
                <input type="password" class="form-control" id="password_confirm" name="password_confirm" required>
            </div>

            <button type="submit" class="btn btn-warning btn-lg fw-bold px-5">S'inscrire</button>
        </form>

        <!-- Bouton retour vers la page d'accueil -->
        <div class="mt-4">
            <a href="/" class="btn btn-outline-light btn-lg fw-bold px-5">Retour à l'accueil</a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
