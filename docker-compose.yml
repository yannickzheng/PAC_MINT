version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: pacmint-server
    ports:
      - "5555:5555"
    restart: unless-stopped
    network_mode: host

  client:
    build:
      context: .
      dockerfile: game/Dockerfile
    container_name: pacmint-client
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0.0}
      - SDL_AUDIODRIVER=alsa
      - XDG_RUNTIME_DIR=/tmp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/snd:/dev/snd
      - /dev/dri:/dev/dri
    devices:
      - /dev/snd:/dev/snd
      - /dev/dri:/dev/dri
    privileged: true
    network_mode: host
    depends_on:
      - server
    command: >
      bash -c "sleep 5 && python game/pacmint.py"
    tty: true
    stdin_open: true