version: '3.8'

services:
  site_web:
    build:
      context: .
      dockerfile: site_web/Dockerfile
    container_name: pacmint-site-web
    restart: unless-stopped
    volumes:
      - ./site_web/staticfiles:/app/staticfiles
      - ./site_web/media:/app/media
    environment:
      - DEBUG=0
      - SECRET_KEY=change-this-secret-key
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1
      - DB_NAME=pacmintdb
      - DB_USER=pacmintuser
      - DB_PASSWORD=pass123
      - DB_HOST=db
    depends_on:
      - db
    command: gunicorn site_web.wsgi:application --bind 0.0.0.0:8000

  db:
    image: postgres:15
    container_name: pacmint-db
    environment:
      POSTGRES_DB: pacmintdb
      POSTGRES_USER: pacmintuser
      POSTGRES_PASSWORD: pass123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  caddy:
    image: caddy:2
    container_name: pacmint-caddy
    ports:
      - "8080:80"
    depends_on:
      - site_web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./site_web/staticfiles:/staticfiles
      - ./site_web/media:/media

  client:
    build:
      context: .
      dockerfile: game/Dockerfile
    container_name: pacmint-client
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0.0}
      - XDG_RUNTIME_DIR=/tmp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri:/dev/dri
    privileged: true
    network_mode: host
    command: >
      bash -c "sleep 5 && python game/pacmint.py"
    tty: true
    stdin_open: true

volumes:
  postgres_data:
