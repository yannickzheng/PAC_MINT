version: '3.8'

services:
  site_web :
    build :
      context : .
      dockerfile : site_web/Dockerfile
    container_name: pacmint-site-web
    ports :
      - "8080:8080"
    restart: unless-stopped


  client:
    build:
      context: .
      dockerfile: game/Dockerfile
    container_name: pacmint-client
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0.0}
      - XDG_RUNTIME_DIR=/tmp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri:/dev/dri
    privileged: true
    network_mode: host
    command: >
      bash -c "sleep 5 && python game/pacmint.py"
    tty: true
    stdin_open: true