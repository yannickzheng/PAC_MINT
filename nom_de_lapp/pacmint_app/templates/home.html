<!DOCTYPE html>
<html lang="fr">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Pac-Mint - Accueil</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/Logo.png' %}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font (style rétro) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'pacmint_app/home.css' %}">
</head>
<body class="bg-black text-white text-center">

    <div class="container py-5">
        <!-- Logo flottant -->
        <img src="{% static 'images/Logo.png' %}" alt="Logo Pac-Mint" class="img-fluid mb-4 logo-animation" style="width: 150px;">

        <!-- Titre -->
        <h1 class="display-4 fw-bold text-warning mb-5" style="font-family: 'Press Start 2P', cursive;">PAC-MINT</h1>

        <!-- Message de bienvenue -->
        <h2 class="mb-4" style="font-family: 'Press Start 2P', cursive; font-size: 2rem; color: #00FF00;">Bienvenue, prêt à dévorer des fantômes ?</h2>

        <!-- Animation Pacman + fantômes -->
        <div class="d-flex justify-content-center align-items-center mb-5 animation-line">
            <div class="pacman me-3"></div>
            <div class="ghost red"></div>
            <div class="ghost pink"></div>
            <div class="ghost cyan"></div>
            <div class="ghost orange"></div>
        </div>

        <!-- Boutons -->
        <div class="d-flex justify-content-center gap-4">
            <a href="/inscription" class="btn btn-warning btn-lg fw-bold px-5">S'inscrire</a>
            <a href="/login" class="btn btn-outline-light btn-lg fw-bold px-5">Se connecter</a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
