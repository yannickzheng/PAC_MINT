<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man | Accueil</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Django Static -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'pacmint_app/home.css' %}">
</head>
<body>

    <div class="container text-center">
        <h1 class="title">Bienvenue sur PacMINT</h1>
        <p class="subtitle">Prêt à jouer ? Inscris-toi ou connecte-toi !</p>

        <img src="{% static 'pacmint_app/pacman.gif' %}" alt="Pac-Man Animation" class="pacman-img">

        <div class="buttons">
            <a href="{% url 'register' %}" class="btn btn-primary">Inscription</a>
            <a href="{% url 'login' %}" class="btn btn-success">Se connecter</a>
        </div>
    </div>

</body>
</html>
