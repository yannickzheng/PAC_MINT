<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Pac-Man</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: black;
            color: yellow;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        /* Petits points façon Pac-Man */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(yellow 2px, transparent 2px);
            background-size: 30px 30px;
            opacity: 0.3;
        }

        .card {
            background-color: black;
            border: 2px solid yellow;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(255, 255, 0, 0.7);
            max-width: 450px;
            width: 100%;
            text-align: center;
            z-index: 2;
        }

        .btn-pacman {
            background-color: yellow;
            color: black;
            font-size: 16px;
            border: 2px solid black;
            padding: 10px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .btn-pacman::before {
            content: "🟡";
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            transition: left 0.3s;
        }

        .btn-pacman:hover::before {
            left: -40px;
        }

        .btn-pacman:hover {
            background-color: black;
            color: yellow;
            border: 2px solid yellow;
        }

        .navbar {
            background-color: yellow !important;
            width: 100%;
        }

        .navbar-brand {
            color: black !important;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- Navbar Pac-Man -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">👾 PAC-MAN SIGNUP</a>
        </div>
    </nav>

    <!-- Formulaire Pac-Man -->
    <div class="card mt-5">
        <h2>🟡 INSCRIPTION 🟡</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-pacman w-100">S'INSCRIRE</button>
        </form>
    </div>

</body>
</html>
