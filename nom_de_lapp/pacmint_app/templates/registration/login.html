<!DOCTYPE html>
<html lang="fr">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Pac-Mint - Connexion</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/Logo.png' %}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font (style rétro) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'pacmint_app/home.css' %}">
</head>
<body class="bg-black text-white text-center">

    <div class="container py-5">
        <!-- Logo flottant -->
        <img src="{% static 'images/Logo.png' %}" alt="Logo Pac-Mint" class="img-fluid mb-4 logo-animation" style="width: 150px;">

        <!-- Titre -->
        <h1 class="display-4 fw-bold text-warning mb-5" style="font-family: 'Press Start 2P', cursive;">PAC-MINT</h1>

        <!-- Message de bienvenue -->
        <h2 class="mb-4" style="font-family: 'Press Start 2P', cursive; font-size: 2rem; color: #00FF00;">Bienvenue dans l'univers de Pac-Mint !</h2>

        <!-- Formulaire de connexion -->
        <div class="d-flex justify-content-center align-items-center mb-5">
            <form method="post" class="w-100" style="max-width: 400px;">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Nom d'utilisateur</label>
                    <input type="text" name="username" id="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-warning btn-lg fw-bold w-100">Se connecter</button>
            </form>
        </div>

        <!-- Lien vers l'inscription -->
        <p class="text-white mt-3" style="font-family: 'Press Start 2P', cursive;">
            Pas encore de compte ? <a href="/inscription" class="text-warning">S'inscrire ici</a>
        </p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
